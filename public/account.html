<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Account — The General Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header class="awning">
    <div class="awning__inner">
      <a class="brand" href="/index.html">
        <span class="brand__mark">GS</span>
        <span class="brand__name">The General Store</span>
      </a>
      <div class="account-slot" id="account-slot"></div>
      <a class="cart-toggle" href="/index.html?openCart=1">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L4 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
        <span>Cart</span>
        <span class="cart-toggle__count" id="cart-count">0</span>
      </a>
    </div>
  </header>

  <main class="account-page account-page--wide">
    <h1>My Account</h1>
    <p class="page-sub" id="account-sub">Manage your profile and password.</p>

    <div id="signin-gate" class="account-card" hidden>
      Please <a href="/login.html">sign in</a> to view your account.
    </div>

    <div id="account-body" hidden>

      <div class="account-section-grid">

        <!-- Profile card -->
        <div class="account-card">
          <div class="account-card__head">
            <h2>Profile</h2>
            <span class="role-badge" id="role-badge"></span>
          </div>
          <p class="form-error" id="profile-error"></p>
          <p class="form-success" id="profile-success"></p>

          <form id="profile-form">
            <label class="field">
              <span>Full name</span>
              <input type="text" id="p-name" required />
            </label>
            <label class="field">
              <span>Email</span>
              <input type="email" id="p-email" required />
            </label>
            <label class="field" id="p-shop-field" hidden>
              <span>Shop name</span>
              <input type="text" id="p-shop-name" />
            </label>
            <span class="field-hint" id="member-since"></span>
            <button type="submit" class="btn btn--primary btn--block" id="profile-submit" style="margin-top:14px;">Save changes</button>
          </form>
        </div>

        <!-- Password card -->
        <div class="account-card">
          <h2>Change password</h2>
          <p class="form-error" id="password-error"></p>
          <p class="form-success" id="password-success"></p>

          <form id="password-form">
            <label class="field">
              <span>Current password</span>
              <input type="password" id="pw-current" autocomplete="current-password" required />
            </label>
            <label class="field">
              <span>New password</span>
              <input type="password" id="pw-new" minlength="6" autocomplete="new-password" required />
              <span class="field-hint">At least 6 characters.</span>
            </label>
            <button type="submit" class="btn btn--secondary btn--block" id="password-submit">Update password</button>
          </form>
        </div>

      </div>

      <!-- Seller shortcut -->
      <div class="account-card account-card--wide" id="seller-panel" hidden>
        <div class="account-card__head">
          <h2>Your Shop</h2>
          <a href="/seller-dashboard.html" class="btn btn--secondary">Manage listings &rarr;</a>
        </div>
        <div class="stat-row" id="seller-stats">
          <p>Loading shop stats&hellip;</p>
        </div>
      </div>

      <!-- Buyer order history -->
      <div id="buyer-panel" hidden>
        <div class="section-title">Order History</div>
        <div id="order-list"><p>Loading&hellip;</p></div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <p>The General Store &middot; demo storefront &middot; no real payments are processed</p>
  </footer>

  <script src="/js/session.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
