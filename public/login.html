<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — The General Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header class="awning">
    <div class="awning__inner">
      <a class="brand" href="/index.html">
        <span class="brand__mark">GS</span>
        <span class="brand__name">The General Store</span>
      </a>
      <div class="account-slot" id="account-slot"></div>
    </div>
  </header>

  <main class="account-page">
    <h1>Sign in</h1>
    <p class="page-sub">Buyers and sellers both sign in here.</p>

    <div class="account-card">
      <p class="form-error" id="form-error"></p>

      <form id="login-form">
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn btn--primary btn--block" id="submit-btn">Sign in</button>
      </form>
    </div>

    <p class="account-page-footer">New here? <a href="/register.html">Create an account</a></p>
  </main>

  <footer class="site-footer">
    <p>The General Store &middot; demo storefront &middot; no real payments are processed</p>
  </footer>

  <script src="/js/session.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
